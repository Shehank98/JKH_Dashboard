<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin sign-in · Ogilvy Orbit Chub</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/vendor/inter/400.css">
<link rel="stylesheet" href="/vendor/inter/500.css">
<link rel="stylesheet" href="/vendor/inter/600.css">
<link rel="stylesheet" href="/vendor/inter/700.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#E0383E;--red-d:#C42A30;--ink:#1A1F36;--grey:#6B7590;--soft:#8A93AD;--line:#DDE3EF}
html,body{height:100%}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 0% 0%,#26315A 0%,#141A2E 55%,#0E1322 100%)}
button,input{font-family:inherit;font-size:inherit}
.blob{position:fixed;border-radius:50%;filter:blur(70px);z-index:0;animation:drift 18s ease-in-out infinite alternate}
.b1{width:460px;height:460px;background:#E0383E;opacity:.28;top:-160px;right:-120px}
.b2{width:420px;height:420px;background:#3B5BDB;opacity:.3;bottom:-160px;left:-120px;animation-duration:24s}
@keyframes drift{50%{transform:translate(40px,30px) scale(1.08)}100%{transform:translate(-30px,50px) scale(.95)}}
.orbit{position:fixed;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;z-index:0;pointer-events:none}
.ring{position:absolute;inset:0;border:1px solid rgba(255,255,255,.08);border-radius:50%;animation:spin 70s linear infinite}
.ring.r2{inset:120px;border-color:rgba(224,56,62,.22);animation-duration:40s;animation-direction:reverse}
.ring.r3{inset:240px;border-style:dashed;border-color:rgba(255,255,255,.08);animation-duration:90s}
.sat{position:absolute;top:-5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#fff;box-shadow:0 0 16px rgba(255,255,255,.7)}
.ring.r2 .sat{background:var(--red);box-shadow:0 0 18px rgba(224,56,62,.9)}
@keyframes spin{to{transform:rotate(360deg)}}
.card{position:relative;z-index:1;width:100%;max-width:420px;background:#fff;border-radius:20px;padding:34px 32px 28px;box-shadow:0 30px 80px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:16px;animation:up .7s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{height:44px}
.badge{display:inline-flex;align-items:center;gap:6px;background:#141A2E;color:#fff;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:6px 10px;border-radius:20px}
.badge svg{width:13px;height:13px}
h1{font-size:22px;letter-spacing:-.4px;margin-top:6px}
.sub{font-size:13.5px;color:var(--grey);line-height:1.5;margin-top:-8px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
input{border:1px solid var(--line);border-radius:11px;padding:12px 13px;font-weight:400;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(224,56,62,.13)}
.primary{position:relative;border:0;background:linear-gradient(135deg,#232C4E,#141A2E);color:#fff;font-weight:700;padding:14px;border-radius:12px;cursor:pointer;font-size:14.5px;box-shadow:0 8px 20px rgba(20,26,46,.3);transition:transform .15s}
.primary:hover{transform:translateY(-1px)}
.primary:disabled{color:transparent;cursor:wait}
.primary:disabled::after{content:'';position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.msg{display:none;font-size:13px;line-height:1.45;padding:10px 12px;border-radius:10px;background:#FDECEC;color:#A4262C}
.msg.on{display:block;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.first{font-size:12.5px;color:var(--grey);line-height:1.5;text-align:center;margin-top:-4px}
.first a{color:var(--red);font-weight:600;text-decoration:none}
.msg a{color:inherit;font-weight:700}
.foot{font-size:13px;color:var(--grey);text-align:center;border-top:1px solid var(--line);padding-top:14px}
.foot a{color:var(--red);font-weight:600;text-decoration:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="orbit" aria-hidden="true"><div class="ring"><span class="sat"></span></div><div class="ring r2"><span class="sat"></span></div><div class="ring r3"></div></div>
<form class="card" id="f" novalidate>
  <div class="top">
    <img src="/ogilvy-orbit-chub-stacked.png" alt="Ogilvy Orbit Chub">
    <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>Admin</span>
  </div>
  <h1>Admin panel</h1>
  <p class="sub">Manage who can sign in to the Live Dashboard. Use the same email and password as your dashboard account; it needs admin access.</p>
  <div class="msg" id="msg" role="alert"></div>
  <label>Ogilvy email<input type="email" name="email" autocomplete="username" placeholder="firstname.lastname@ogilvy.com" required></label>
  <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
  <button class="primary" type="submit">Sign in to admin</button>
  <p class="first">First time? <a href="/login#signup">Create your account</a> with your admin email, confirm the code, then sign in here.</p>
  <div class="foot">Not an admin? <a href="/login">Go to the dashboard sign-in</a></div>
</form>
<script>
(function () {
  const f = document.getElementById('f'), msg = document.getElementById('msg');
  f.email.focus();
  f.addEventListener('submit', async e => {
    e.preventDefault();
    msg.className = 'msg';
    const btn = f.querySelector('.primary');
    btn.disabled = true;
    try {
      const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: f.email.value.trim(), password: f.password.value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        if (j.setup) { msg.innerHTML = ''; msg.append(j.error + ' '); const a = document.createElement('a'); a.href = '/login#signup'; a.textContent = 'Create account'; msg.append(a); void msg.offsetWidth; msg.className = 'msg on'; return; }
        throw new Error(j.error || 'Something went wrong. Please try again.');
      }
      location.replace('/admin');
    } catch (err) {
      msg.textContent = err.message; void msg.offsetWidth; msg.className = 'msg on';
    } finally { btn.disabled = false; }
  });
})();
</script>
</body>
</html>
